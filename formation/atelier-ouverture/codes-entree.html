<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codes d'entrée · Formateur</title><style>:root{--teal:#0e6e6b;--line:#d2dede}*{box-sizing:border-box}body{background:#f4f7f7;color:#14262b;font:17px/1.5 system-ui;margin:0}.page{max-width:850px;margin:auto;padding:32px 20px}h1{font-size:clamp(26px,5vw,36px)}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin:18px 0}button,.btn{background:var(--teal);color:white;border:0;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;max-width:100%}.entry{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0}.entry span{flex:1;min-width:200px}.entry code{font-size:15px;background:#e2efee;padding:7px;border-radius:6px}.muted{color:#5a6c71}.hidden{display:none}#status{min-height:1.5em}</style></head><body><main class="page"><a class="btn" href="index.html">← Atelier d’ouverture</a><h1>🔐 CODES D’ENTRÉE</h1><p class="muted">Espace réservé au formateur. Cette page regroupe les deux codes d’accès aux outils d’animation et les six codes des étapes 2 à 7. Les codes sont chiffrés dans cette page.</p><section class="panel" id="gate"><form id="login"><label for="password">Mot de passe formateur</label><p><input id="password" type="password" autocomplete="off" required> <button>Accéder</button></p></form><p id="status" role="status"></p></section><section class="panel hidden" id="results"><h2>Atelier d’ouverture · Codes formateur</h2><div id="entries"></div><button id="logout" type="button">Fermer / Déconnexion</button></section></main><script>const SALT="vBfKAL13mVAibsEieGWQvg==",IV="1Yq6RHkcHDRWFYaT",DATA="c5brEZAXlEHPwuPyPHw3zn2F/I1qgYeaiLSgF4M6Y2HCRKEBlmyXYSo61CBrl8qg1XwTfHMFlQKR8qdVqHSZogsHkgFbATv16cTLLYEapMymza+f2J97//lK8KbLi0jXYYc+K4P2ATNYhZkB2l2q+8/r6HsReACfS4e7LqQjjz1aGE1z8rRN7Izutj3nP5ufbF/7xfFKwA9eFMoCNGvGd9kDu7su1GSqxtiA06+0i8fYLRUKuvB+sq3jrzCYtifZgn7GcHBlfMoX3tcpydaxbhvpgNRspopvMBQwMTm/sUgCXfAuZT9UPZ413MN066ZvR1lRGuBzV9dQOzIT2CvQFG6zq2Kn/cMfou91x1sEiIX3alviOl2Mjk+nWLudbW1VmG3t8BQLsI+Y2PKtcTIE2sJi+fRGxknYZ6SVuZu9yMk1zkFvTR/5UKyBt4gsahjd49I/tocMIXAk8JC+QRTR4QGdzYSh3/hKL1T35V5BkMhGEqQRkh0=";const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let current=[];document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();try{const password=document.getElementById("password").value;const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(SALT),iterations:250000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(DATA));current=JSON.parse(new TextDecoder().decode(raw));const entries=document.getElementById("entries");entries.replaceChildren();current.forEach(([label,code])=>{const row=document.createElement("div");row.className="entry";const name=document.createElement("span");name.textContent=label;const value=document.createElement("code");value.textContent=code;const copy=document.createElement("button");copy.textContent="Copier";copy.type="button";copy.onclick=async()=>{await navigator.clipboard.writeText(code);copy.textContent="Copié ✓"};row.append(name,value,copy);entries.append(row)});document.getElementById("gate").classList.add("hidden");document.getElementById("results").classList.remove("hidden");document.getElementById("password").value=""}catch(err){document.getElementById("status").textContent="Mot de passe incorrect."}});document.getElementById("logout").onclick=()=>{current=[];document.getElementById("entries").replaceChildren();document.getElementById("results").classList.add("hidden");document.getElementById("gate").classList.remove("hidden");document.getElementById("status").textContent=""};</script></body></html>
