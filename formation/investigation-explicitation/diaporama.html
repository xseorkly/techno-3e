<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diaporama — Investigation en technologie</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#14262b;background:#edf4f3}*{box-sizing:border-box}body{margin:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 22px;background:#fff;border-bottom:1px solid #cbdada}.bar a{color:#0e6e6b}.deck{max-width:1100px;margin:3vh auto;padding:20px}.slide{min-height:min(68vh,660px);background:#fff;border-radius:24px;box-shadow:0 16px 38px #14302c14;padding:clamp(26px,6vw,74px);display:flex;flex-direction:column;justify-content:center;border-top:12px solid #0e6e6b}.eyebrow{font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#b21858;font-size:13px}h1{font-size:clamp(32px,5.7vw,66px);line-height:1.1;max-width:100%;margin:24px 0}p{font-size:clamp(20px,2.6vw,33px);line-height:1.45;max-width:48ch}.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:22px;flex-wrap:wrap}button{background:#0e6e6b;color:white;border:0;padding:13px 22px;border-radius:12px;font-size:16px;cursor:pointer}button:disabled{opacity:.3}.hint{color:#617277;font-size:13px;text-align:center}button:focus-visible,a:focus-visible{outline:3px solid #b21858;outline-offset:3px}@media print{.bar,.controls,.hint{display:none}.deck{margin:0;padding:0}.slide{box-shadow:none;break-after:page;height:95vh}}@media(max-width:600px){.deck{padding:12px}.slide{min-height:65vh;padding:26px}}</style></head><body><header class="bar"><b>Technologie · Didactique</b><a href="../index.html">← Retour à la formation</a></header><main class="deck"><article class="slide" aria-live="polite"><div class="eyebrow" id="label"></div><h1 id="title"></h1><p id="body"></p></article><nav class="controls"><button id="prev">← Précédent</button><span id="count"></span><button id="next">Suivant →</button><button onclick="window.print()">Imprimer / PDF</button></nav><p class="hint">Utilisez les flèches ← → du clavier pour naviguer. 18 diapositives.</p></main><script>const slides=[["Faire chercher. Faire comprendre. Faire apprendre.","Démarche d’investigation en technologie • Formation enseignants"],["Question de départ","Une activité réussie signifie-t-elle nécessairement que l’élève a appris ?"],["Deux notions à distinguer","L’enseignement explicite est une modalité structurée ; l’explicitation des apprentissages peut accompagner une démarche d’investigation."],["Le risque du tout implicite","L’élève réalise la tâche, mais ne comprend pas forcément le savoir qu’il devait construire. La réussite technique peut masquer une compréhension fragile."],["Le cap en technologie","Ne pas donner systématiquement le savoir avant le problème : créer une situation qui rend ce savoir nécessaire."],["Démarches mobilisées","Investigation • résolution de problème technique • démarche technologique • démarche de projet • créativité et expérimentation."],["Un équilibre didactique","Le problème, les contraintes et les critères de validation sont clairs. Les connaissances, stratégies et solutions restent à construire."],["Situation-problème : micro:bit","L’éclairage automatique reste allumé alors que la pièce est lumineuse. Pourquoi ? Comment corriger le comportement du système ?"],["Phase 1 • Problématiser","Observer le dysfonctionnement, formuler le problème, relever les contraintes et faire émerger des hypothèses."],["Phase 2 • Investiguer","Rechercher des informations, confronter les hypothèses, programmer, tester, mesurer et ajuster sans recevoir la solution toute faite."],["Phase 3 • Structurer","Comparer les démarches, justifier, formaliser la notion de condition logique et dégager des connaissances transférables."],["Guider sans donner la réponse","« Quel indice te fait penser cela ? » • « Comment pourrais-tu vérifier ? » • « Quel paramètre peux-tu faire varier ? »"],["Tâche ≠ apprentissage","« Construire un pont en carton » est une tâche. « Comprendre l’influence de la forme sur sa résistance » est l’enjeu d’apprentissage."],["La confrontation est décisive","Faire expliciter les choix, examiner les erreurs et mettre en débat plusieurs solutions à partir des observations."],["L’institutionnalisation","Ce que nous avons fait → ce que nous avons constaté → ce que nous avons compris → ce que nous pouvons réutiliser."],["Observer une séance","Les élèves problématisent-ils ? Cherchent-ils réellement ? Justifient-ils ? Le professeur régule-t-il ? Les acquis sont-ils structurés ?"],["Atelier entre collègues • 15 min","Transformez une consigne procédurale en situation-problème. Définissez le savoir visé, deux relances sans réponse et une trace de synthèse."],["À retenir","Faire chercher ne signifie pas laisser les apprentissages implicites. La recherche construit le savoir ; la structuration le rend visible et réutilisable."]];let n=0;const show=()=>{document.getElementById('label').textContent='Formation enseignants · Diapositive '+(n+1);document.getElementById('title').textContent=slides[n][0];document.getElementById('body').textContent=slides[n][1];document.getElementById('count').textContent=(n+1)+' / '+slides.length;document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===slides.length-1};document.getElementById('prev').onclick=()=>{n=Math.max(0,n-1);show()};document.getElementById('next').onclick=()=>{n=Math.min(slides.length-1,n+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});show();</script></body></html>
