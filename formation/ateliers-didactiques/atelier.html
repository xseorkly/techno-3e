<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier didactique</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../expertise-sequence/formation.css"><link rel="stylesheet" href="puzzle.css">
<style>
.topbar{position:sticky;top:0;z-index:50;background:rgba(244,247,247,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -22px 0;padding:10px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topbar .who{font:700 16px Archivo,sans-serif}
.topbar .who span{color:var(--muted);font-weight:600}
.topbar .phase{margin-left:auto;font:700 14px Archivo,sans-serif;color:var(--teal2)}
.topbar .phase.b{color:var(--mag)}
.stage{border-left:6px solid var(--c)}
.stage .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font:700 17px Archivo,sans-serif;margin-right:8px}
ol.dq{margin:10px 0;padding-left:22px}ol.dq li{margin:6px 0}
.next{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--c);color:#fff;border-radius:16px;padding:18px 20px;text-decoration:none}
.next b{font:700 22px Archivo,sans-serif}.next span{opacity:.9}
.gpick{display:flex;gap:10px;flex-wrap:wrap}
.gpick button{width:60px;height:60px;border-radius:16px;border:2px solid var(--teal);background:#fff;color:var(--teal2);font:700 24px Archivo,sans-serif;cursor:pointer}
</style>
<script>if(sessionStorage.getItem('formation_teachers_unlocked_v1')!=='1')location.replace('../index.html');</script><style id="navbar-css">.fnav{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:4px 14px;background:transparent;font:500 13px/1.3 "Source Sans 3",Arial,sans-serif}.fnav a{color:#5b6b6a!important;text-decoration:none!important;padding:2px 0;background:none;border-radius:0}.fnav a:hover,.fnav a:focus-visible{color:#0f6b66!important;text-decoration:underline!important}@media print{.fnav{display:none}}</style></head>
<body><nav class="fnav" aria-label="Navigation Formation"><a href="../index.html">← Formation enseignants</a><a href="index.html">↑ Ateliers didactiques</a></nav>
<main class="page" id="root"></main>
<script src="data.js"></script><script src="puzzle.js"></script><script src="rotation.js"></script>
<script>
(()=>{const P=window.PUZZLE,A=P.parcours,esc=PZ.esc,root=document.getElementById('root');let tick=null;
function draw(){
  clearInterval(tick);
  const ai=Math.max(0,A.findIndex(a=>a.id===(location.hash||'#'+A[0].id).slice(1)));const a=A[ai];
  document.title=`Atelier ${ai+1} · ${a.nom}`;
  const g=ROT.groupe();
  if(!g){root.innerHTML=`<header class="hero" style="--c:${a.couleur}"><div class="brand">Atelier ${ai+1} · ${esc(a.nom)}</div><h1>Quel est votre groupe ?</h1><div class="gpick">${[1,2,3,4,5,6].map(n=>`<button type="button" data-g="${n}">${n}</button>`).join('')}</div></header>`;
    root.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ROT.setGroupe(+b.dataset.g);draw()});return}
  const t=ROT.tourDe(g,ai),ord=ROT.ordre(g),st=ROT.reponses(g);
  if(!st.membres){const m=ROT.membresConnus(g);if(m)st.membres=m}
  const save=()=>ROT.setReponses(g,st);
  const nextAi=ord[t];const next=t<3?{href:`atelier.html#${A[nextAi].id}`,txt:`Tour ${t+1} · Atelier ${nextAi+1} · ${A[nextAi].nom}`,c:A[nextAi].couleur}:{href:'bilan.html',txt:'Atelier 4 · Bilan',c:'#c2185b'};
  root.innerHTML=`
  <div class="topbar"><span class="who">Groupe ${g} <span>· Tour ${t} sur 3</span></span><button class="timer" type="button" id="timer">▶ 20:00</button><span class="phase" id="phase">Étape 1 · Le défi (12 min)</span></div>
  <header class="hero" style="margin-top:16px"><div class="brand" style="color:${a.couleur}">Atelier ${ai+1} · ${esc(a.nom)} · 20 min</div><h1>« ${esc(a.accroche)} »</h1>
    <div class="f" style="position:relative;z-index:1"><strong>Qui passe dans cet atelier ?</strong><input type="text" data-k="membres" placeholder="Prénoms du groupe ${g}"></div></header>

  <section class="section"><div class="card stage" style="--c:${a.couleur}">
    <h2><span class="num">1</span>Le défi · 12 min</h2>
    <p>Vivez-le comme des élèves : dites ce que vous pensez, même si c’est faux. <strong>Le défi est volontairement exigeant</strong> : vous n’aurez peut-être pas le temps de tout traiter. Notez précisément où vous bloquez, c’est la matière de l’étape 2.</p>
    <div class="situation">${a.contexte}</div>
    <strong>À discuter :</strong><ol class="dq">${a.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
    ${a.revelation?`<details class="reserved"><summary>La révélation : à ouvrir après la question 1</summary><div class="reveal">${a.revelation}</div></details>`:''}
    <details class="reserved"><summary>Coup de pouce : seulement si vous êtes bloqués</summary><ol>${a.aides.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p style="margin:0 0 8px">Notez quel coup de pouce vous a débloqués : il servira à l’étape 2.</p></details>
    <div class="f"><strong>Nos réponses (numérotez-les)</strong><textarea data-k="${a.id}_defi" style="min-height:130px"></textarea></div>
  </div></section>

  <section class="section"><div class="card stage" style="--c:var(--mag)">
    <h2><span class="num">2</span>Les trois questions · 8 min</h2>
    <p>Reprenez votre posture d’enseignant. Ce sont les mêmes questions dans les trois ateliers. Pas de généralités : chaque réponse part de ce que vous venez de vivre.</p>
    ${P.lunettes.map(l=>`<div class="lensq" style="--c:${l.couleur}"><div class="f"><span class="lens-tag">${esc(l.nom)}</span> <strong style="display:inline">${esc(l.titre)}</strong><small>${esc(l.question)}</small><textarea data-k="${a.id}_${l.id}"></textarea></div></div>`).join('')}
    <p style="margin:6px 0 0"><strong>Éclairage :</strong> ${esc(a.eclairage.retenir)}</p>
    <details class="reserved" style="border-color:var(--teal)"><summary style="color:var(--teal2)">À la fin : ce qui était attendu</summary><p>${esc(a.attendu)}</p></details>
  </div></section>

  <section class="section"><a class="next" href="${next.href}" style="--c:${next.c}"><span><span style="display:block;font-size:14px">Quand le formateur annonce la fin du tour</span><b>${esc(next.txt)} →</b></span><span>${t<3?'Tour suivant':'65 → 90 min'}</span></a></section>
  <p style="text-align:center;margin-top:14px"><a href="index.html">Changer de groupe</a> · <a href="${a.lien}">Parcours complet de cet atelier (8 h)</a></p>`;
  root.querySelectorAll('[data-k]').forEach(el=>{el.value=st[el.dataset.k]||'';el.addEventListener('input',()=>{st[el.dataset.k]=el.value;save()})});
  let left=1200;const b=document.getElementById('timer'),ph=document.getElementById('phase');
  const fmt=()=>`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
  const paint=()=>{if(left<=480&&left>0){ph.textContent='Étape 2 · Les trois questions (8 min)';ph.classList.add('b')}if(left<=0){ph.textContent='Fin du tour : passez à la suite'}};
  b.onclick=()=>{if(left<=0){left=1200;b.classList.remove('end');ph.classList.remove('b');ph.textContent='Étape 1 · Le défi (12 min)';b.textContent='▶ '+fmt();return}
    if(tick){clearInterval(tick);tick=null;b.classList.remove('run');b.textContent='▶ '+fmt();return}
    b.classList.add('run');b.textContent='❚❚ '+fmt();tick=setInterval(()=>{left--;b.textContent='❚❚ '+fmt();paint();if(left<=0){clearInterval(tick);tick=null;b.classList.remove('run');b.classList.add('end');b.textContent='Temps écoulé'}},1000)};
}
window.addEventListener('hashchange',()=>{draw();scrollTo(0,0)});draw();
})();
</script>
<script src="../common-tools.js"></script>
</body></html>
