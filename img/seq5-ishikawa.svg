<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f4f7f7"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="34" fill="#0E6E6B" font-weight="700">Le diagramme d'Ishikawa : chercher les causes d'un problème</text>
  <line x1="150" y1="360" x2="1020" y2="360" stroke="#14262B" stroke-width="8"/>
  <polygon points="1020,330 1115,360 1020,390" fill="#C2185B"/>
  <rect x="875" y="288" width="260" height="145" rx="18" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <text x="1005" y="346" text-anchor="middle" font-family="Arial" font-size="28" fill="#14262B" font-weight="700">EFFET</text>
  <text x="1005" y="385" text-anchor="middle" font-family="Arial" font-size="22" fill="#5A6C71">ex. le courrier tombe</text>
  <line x1="280" y1="360" x2="200" y2="250" stroke="#0E6E6B" stroke-width="6"/>
  <line x1="420" y1="360" x2="340" y2="250" stroke="#0E6E6B" stroke-width="6"/>
  <line x1="560" y1="360" x2="480" y2="250" stroke="#0E6E6B" stroke-width="6"/>
  <line x1="280" y1="360" x2="200" y2="470" stroke="#0E6E6B" stroke-width="6"/>
  <line x1="420" y1="360" x2="340" y2="470" stroke="#0E6E6B" stroke-width="6"/>
  <line x1="560" y1="360" x2="480" y2="470" stroke="#0E6E6B" stroke-width="6"/>
  <rect x="50" y="150" width="220" height="74" rx="16" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <rect x="290" y="150" width="220" height="74" rx="16" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <rect x="530" y="150" width="220" height="74" rx="16" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <rect x="50" y="495" width="220" height="74" rx="16" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <rect x="290" y="495" width="220" height="74" rx="16" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <rect x="530" y="495" width="220" height="74" rx="16" fill="#fff" stroke="#D2DEDE" stroke-width="3"/>
  <g font-family="Arial" font-size="26" fill="#14262B" font-weight="700" text-anchor="middle">
    <text x="160" y="196">MATIÈRE</text><text x="400" y="196">MATÉRIEL</text><text x="640" y="196">MILIEU</text>
    <text x="160" y="541">MÉTHODE</text><text x="400" y="541">UTILISATEUR</text><text x="640" y="541">MESURE</text>
  </g>
  <g font-family="Arial" font-size="20" fill="#5A6C71" text-anchor="middle">
    <text x="160" y="610">Chercher les familles de causes</text>
    <text x="600" y="670">Astuce : une bonne cause explique le problème, elle n'est pas une solution.</text>
  </g>
</svg>